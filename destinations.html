<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destinations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <img src="images/logo.png" alt="Uttarakhand Trails Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="destinations.html" class="active">Destinations</a></li>
                <li><a href="packages.html">Packages</a></li>
                <li><a href="book.html">Book Now</a></li>
                <li><a href="blog.html">Blog</a></li>
            </ul>
        </nav>
    </header>
    <section class="hero destination-hero">
        <div class="hero-text">
            <h1>Explore Uttarakhand</h1>
            <p>
                Discover mountains, valleys, temples and beautiful hill towns.
            </p>
        </div>
    </section>

        <h2 class="section-title">Explore Our Destinations</h2>

            <div class="destination-card">

                    <h3>Mussoorie</h3>
                </div>
            </div>
            <div class="destination-card">
                <img src="images/rishikesh.png" alt="Rishikesh">
                <div class="overlay">
                    <h3>Rishikesh</h3>
                </div>
            </div>
            <div class="destination-card">
                <img src="images/haridwar.png" alt="Haridwar">
                <div class="overlay">
                    <h3>Haridwar</h3>
                </div>
            </div>
            <div class="destination-card">
                <img src="images/nainital.png" alt="Nainital">
                <div class="overlay">
                    <h3>Nainital</h3>
                </div>
            </div>
            <div class="destination-card">
                <img src="images/kedarnath.png" alt="Kedarnath">
                <div class="overlay">
                    <h3>Kedarnath</h3>
                </div>

            <div class="destination-card">
                <img src="images/badrinath.png" alt="Badrinath">
                <div class="overlay">
                    <h3>Badrinath</h3>
                </div>

            <div class="destination-card">
                <img src="images/bhadraj.png" alt="Bhadraj">

                    <h3>Bhadraj</h3>
                </div>

            <div class="destination-card">
                <img src="images/valley of flowers.png" alt="Valley of Flowers">
                <div class="overlay">
                    <h3>Valley of Flowers</h3>
                </div>
            </div>
            <div class="destination-card">
                <img src="images/chakrata.png" alt="Chakrata">
                <div class="overlay">
                    <h3>Chakrata</h3>
                </div>
            </div>
            <div class="destination-card">
                <img src="images/moila-top.png" alt="Moila Top">
                <div class="overlay">
                    <h3>Moila Top</h3>
                </div>
            </div>
        </div>
    </section>

</html>
